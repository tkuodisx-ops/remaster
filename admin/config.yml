backend:
  name: github
  repo: tkuodisx-ops/remaster
  branch: main

site_url: /remaster/
media_folder: nuotraukos
public_folder: /nuotraukos
locale: lt

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: straipsniai
    label: Straipsniai
    label_singular: Straipsnis
    folder: straipsniai
    extension: md
    format: frontmatter
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{title}}"
    summary: "{{pavadinimas}} ({{data}})"
    sortable_fields: [data, pavadinimas]
    fields:
      - { label: Pavadinimas, name: pavadinimas, widget: string }
      - { label: Data, name: data, widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD" }
      - { label: Trumpas aprašymas, name: aprasymas, widget: string, hint: "Rodomas straipsnių sąraše ir Google paieškoje" }
      - { label: Viršelio nuotrauka, name: nuotrauka, widget: image, required: false }
      - { label: Tekstas, name: body, widget: markdown }
